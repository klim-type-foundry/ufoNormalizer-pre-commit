name: Feature request
description: An idea for something new, or for something to work differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with?
      description: What are you trying to do, and what makes it hard now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the hook help? Sketches and screenshots are welcome.
