- id: ufonormalizer
  name: ufoNormalizer
  description: Normalise UFOs with ufoNormalizer.
  entry: ufonormalizer-pre-commit
  language: python
  # Any file in a UFO. The hook normalises the whole UFO each file is in
  files: '(?i)\.ufo/'
  # Several batches of files at once could normalise the same UFO at once
  require_serial: true
  stages: [ pre-commit, manual ]
